
# C++ Support
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
# FPU Support
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# ESP32-S3 PSRAM - Use PSRAM for large allocations!
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_ESP_SPIRAM_HEAP_SIZE=4194304

# Memory - Optimized for DRAM (128 KB internal heap + 4 MB Octal PSRAM fallback)
CONFIG_HEAP_MEM_POOL_SIZE=131072
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_IDLE_STACK_SIZE=2048
CONFIG_ISR_STACK_SIZE=4096

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_PRINTK=n
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# GPIO
CONFIG_GPIO=y

# I2S
CONFIG_I2S=y
CONFIG_I2S_ESP32=y
CONFIG_I2S_ESP32_RX_BLOCK_COUNT=32
CONFIG_DMA=y
CONFIG_DMA_ESP32=y

# Ring buffer
CONFIG_RING_BUFFER_LARGE=y

# Disable unnecessary features to save RAM
CONFIG_DEBUG_THREAD_INFO=n
CONFIG_THREAD_STACK_INFO=n
CONFIG_STACK_SENTINEL=n

# Speed Optimizations (Compile with -O2)
CONFIG_SPEED_OPTIMIZATIONS=y

# Bluetooth Low Energy (BLE) Server Configuration
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="XIAO_SENSE_BLE"

# BLE MTU and TX Buffer Configuration for Structured GATT Notifications (Expanded for Timestamps)
CONFIG_BT_L2CAP_TX_MTU=128
CONFIG_BT_BUF_ACL_TX_SIZE=132
CONFIG_BT_BUF_ACL_RX_SIZE=132
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_CONN_TX_MAX=10
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=1000

# CPU Clock Frequency (160 MHz)
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=160000000
