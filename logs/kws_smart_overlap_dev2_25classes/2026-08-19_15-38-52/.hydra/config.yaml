experiment_name: kws_smart_overlap_dev2_25classes
training:
  batch_size: 64
  epochs: 100
  patience: 10
  min_delta: 0.001
model:
  _target_: models.streaming.Improved_Phi_GRU_ATT_Streaming
  num_classes: 25
  n_mel_bins: 40
  hidden_dim: 32
  n_fft: 256
  hop_length: 160
  export_mode: false
  matchbox:
    input_channels: 40
    base_filters: 32
    block_filters: 16
    dropout_rate: 0.25
    use_se: true
    expansion_factor: 0.8
    num_blocks: 2
    sub_blocks_per_block: 2
    kernel_sizes:
    - 7
    - 5
    - 3
    - 3
    - 3
    - 5
    - 3
    - 1
    dilations:
    - 1
    - 2
    - 4
    - 8
    - 4
    - 2
    - 1
    - 1
    skip_connections:
      enable_block_skips: true
      enable_sub_block_skips: true
      enable_final_skip: true
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.001
  weight_decay: 1.0e-05
scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: 100
  eta_min: 5.0e-06
  verbose: true
dataset:
  defaults: null
  preload: true
  allowed_classes:
  - backward
  - bed
  - bird
  - cat
  - dog
  - down
  - eight
  - go
  - happy
  - house
  - learn
  - left
  - marvin
  - nine
  - 'no'
  - 'off'
  - one
  - right
  - sheila
  - stop
  - three
  - tree
  - wow
  - 'yes'
  - nothing
  train:
    _target_: datasets.SpeechCommandsDataset
    root_dir: speech_commands_dataset
    subset: training
    augment: true
  val:
    _target_: datasets.SpeechCommandsDataset
    root_dir: speech_commands_dataset
    subset: validation
    augment: false
  test:
    _target_: datasets.SpeechCommandsDataset
    root_dir: speech_commands_dataset
    subset: testing
    augment: false
